; Shared by dashboard PHP and the manually launched translation worker. Keep /conf protected by the web server.
; Authentication uses the current RootAdmin session access token only; no credentials are configured here.
; All fields support DBB_ + upper-case key overrides, e.g. DBB_TRANSLATIONAUTOENABLED.
fileDesc = "Manually started dashboard translations"
customForm = "false"
fileDeletable = "false"

translationAutoEnabled[desc] = "Enable manually started translations (yes/no)"
translationAutoEnabled[dev] = "yes"
translationAutoEnabled[test] = "yes"
translationAutoEnabled[prod] = "yes"

translationAutoApiUrl[desc] = "LLM Inference API HTTPS URL (required when enabled)"
translationAutoApiUrl[dev] = ""
translationAutoApiUrl[test] = ""
translationAutoApiUrl[prod] = ""

translationAutoAuthMode[desc] = "Authentication: session (default local RootAdmin token) or dedicated (central technical user)"
translationAutoAuthMode[dev] = "session"
translationAutoAuthMode[test] = "session"
translationAutoAuthMode[prod] = "session"

translationAutoApiEndpoint[desc] = "Gateway endpoint field in inference JSON; independent of the public API URL"
translationAutoApiEndpoint[dev] = ""
translationAutoApiEndpoint[test] = ""
translationAutoApiEndpoint[prod] = ""

translationAutoTokenUrl[desc] = "(session/dedicated) Dedicated only: central Keycloak HTTPS token endpoint"
translationAutoTokenUrl[dev] = ""
translationAutoTokenUrl[test] = ""
translationAutoTokenUrl[prod] = ""

translationAutoClientId[desc] = "Dedicated only: central Keycloak client with Direct Access Grants enabled"
translationAutoClientId[dev] = ""
translationAutoClientId[test] = ""
translationAutoClientId[prod] = ""

translationAutoClientSecret[desc] = "Dedicated only: client secret if required; leave empty for a public client"
translationAutoClientSecret[dev] = ""
translationAutoClientSecret[test] = ""
translationAutoClientSecret[prod] = ""

translationAutoUsername[desc] = "Dedicated only: central technical user authorized by API Manager"
translationAutoUsername[dev] = ""
translationAutoUsername[test] = ""
translationAutoUsername[prod] = ""

translationAutoPassword[desc] = "Dedicated only: technical user password; set locally or via DBB_TRANSLATIONAUTOPASSWORD, never commit real credentials"
translationAutoPassword[dev] = ""
translationAutoPassword[test] = ""
translationAutoPassword[prod] = ""

translationAutoPhpBinary[desc] = "Absolute path to PHP CLI (typically: /usr/bin/php or /usr/local/bin/php)"
translationAutoPhpBinary[dev] = "/usr/local/bin/php"
translationAutoPhpBinary[test] = "/usr/local/bin/php"
translationAutoPhpBinary[prod] = "/usr/local/bin/php"

translationAutoMaxItems[desc] = "Maximum dictionary rows per run; suggested 2000"
translationAutoMaxItems[dev] = "2000"
translationAutoMaxItems[test] = "2000"
translationAutoMaxItems[prod] = "2000"

translationAutoBatchItems[desc] = "Maximum distinct texts per request; suggested 100 to keep JSON responses manageable"
translationAutoBatchItems[dev] = "100"
translationAutoBatchItems[test] = "100"
translationAutoBatchItems[prod] = "100"

translationAutoBatchTokens[desc] = "Maximum estimated input content tokens per request; suggested 12000"
translationAutoBatchTokens[dev] = "12000"
translationAutoBatchTokens[test] = "12000"
translationAutoBatchTokens[prod] = "12000"

translationAutoMaxTextTokens[desc] = "Maximum estimated source tokens per label; suggested 2048, no greater than BatchTokens"
translationAutoMaxTextTokens[dev] = "2048"
translationAutoMaxTextTokens[test] = "2048"
translationAutoMaxTextTokens[prod] = "2048"

translationAutoMaxSeconds[desc] = "Worker time budget in seconds; suggested 120, not a promise to finish all selected rows"
translationAutoMaxSeconds[dev] = "120"
translationAutoMaxSeconds[test] = "120"
translationAutoMaxSeconds[prod] = "120"

translationAutoTimeoutSeconds[desc] = "Overall connection and inference timeout in seconds; suggested 60, reduced to the remaining run budget"
translationAutoTimeoutSeconds[dev] = "60"
translationAutoTimeoutSeconds[test] = "60"
translationAutoTimeoutSeconds[prod] = "60"

translationAutoMaxAttempts[desc] = "Maximum attempts per item within one run; malformed batches retry individually; suggested 3"
translationAutoMaxAttempts[dev] = "3"
translationAutoMaxAttempts[test] = "3"
translationAutoMaxAttempts[prod] = "3"

translationAutoOutputTokens[desc] = "Maximum completion tokens requested from the LLM; suggested 8192"
translationAutoOutputTokens[dev] = "8192"
translationAutoOutputTokens[test] = "8192"
translationAutoOutputTokens[prod] = "8192"

translationAutoContextTokens[desc] = "Context actually configured on the inference server, input plus output; 380000 for this deployment"
translationAutoContextTokens[dev] = "380000"
translationAutoContextTokens[test] = "380000"
translationAutoContextTokens[prod] = "380000"

translationAutoIncludeEnglish[desc] = "Include en_US in manually started processing (yes/no)"
translationAutoIncludeEnglish[dev] = "no"
translationAutoIncludeEnglish[test] = "no"
translationAutoIncludeEnglish[prod] = "no"

translationAutoGlossary[desc] = "Optional JSON object with meaning and terminology translation guidance into the target language. If present but not used, do not leave empty but use {}"
translationAutoGlossary[dev] = "{}"
translationAutoGlossary[test] = "{}"
translationAutoGlossary[prod] = "{}"
